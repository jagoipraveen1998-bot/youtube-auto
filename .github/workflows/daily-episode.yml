name: Daily English story episodes

on:
  schedule:
    - cron: "20 3 * * *" # 8:50 AM India time
  workflow_dispatch:
    inputs:
      mode:
        description: "Render only by default, or upload privately"
        type: choice
        default: no-upload
        options:
          - no-upload
          - full

permissions:
  contents: write

concurrency:
  group: daily-episode-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  make-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        id: apt
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          PKGS="ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji fonts-comic-neue"
          sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS || (sudo timeout 120 apt-get update -qq && sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS)
          ffmpeg -version | head -1

      - name: Install ffmpeg (backup download)
        if: steps.apt.outcome != 'success'
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5

      - name: Install Python packages
        timeout-minutes: 5
        run: pip install -q -r requirements.txt

      - name: Write today's funny English story episode
        timeout-minutes: 70
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "no-upload" ]; then
            python run_episode.py --no-upload
          else
            python run_episode.py
          fi

      - name: Keep episode files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-story-episode-${{ github.run_number }}
          path: |
            output_episodes/episode.mp4
            output_episodes/thumbnail.jpg
            output_episodes/description.txt
            output_episodes/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Save episode history
        if: success()
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episode_history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            for i in 1 2 3 4 5; do
              if git pull -q --rebase && git push -q; then exit 0; fi
              sleep $((RANDOM % 10 + 3))
            done
            echo "Could not push episode history after five retries" >&2
            exit 1
          fi
