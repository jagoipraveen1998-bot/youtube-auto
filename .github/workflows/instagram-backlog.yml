name: Instagram backlog (older videos, a few a day)

on:
  schedule:
    - cron: "41 1,5,9,13,17,21 * * *"   # 6 posts a day, about every 4 hours
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to post now"
        default: "1"
      method:
        description: "Optional: resumable to upload directly instead of by link"
        default: ""
      pick:
        description: "Optional: part of a file name to post first"
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-backlog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Post the next older video
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          IG_PICK: ${{ inputs.pick }}
          IG_METHOD: ${{ inputs.method }}
        run: python -m autotube.ig_backlog "${{ inputs.count || '1' }}"
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/instagram_backlog_posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Instagram backlog: posted more older videos"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
