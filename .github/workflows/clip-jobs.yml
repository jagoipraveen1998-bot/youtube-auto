name: Clip jobs (Stream Snipz)
# Push a recording to incoming/<name>.webm with incoming/<name>.json ({"hook": "...", "start": 0, "end": 45})
# on the clip-jobs branch: this makes the finished vertical clip (subtitles, hook, Subscribe-to-Tomo end) and
# commits it to the clips-out branch as <name>.mp4 (+ <name>.txt transcript).
on:
  push:
    branches: [clip-jobs]
    paths: ['incoming/**']
permissions:
  contents: write
concurrency:
  group: clip-jobs
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q faster-whisper
      - name: Make clips
        run: |
          mkdir -p out
          for j in incoming/*.json; do
            n=$(basename "$j" .json); src=$(ls incoming/$n.* | grep -v json | head -1)
            [ -f "$src" ] || continue
            hook=$(python -c "import json;print(json.load(open('$j')).get('hook',''))")
            st=$(python -c "import json;print(json.load(open('$j')).get('start',0))")
            en=$(python -c "import json,subprocess;d=json.load(open('$j'));print(d.get('end') or float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','$src']).decode()))")
            python tools/clipmaker.py --file "$src" --start "$st" --end "$en" --hook "$hook" --out "out/$n.mp4"
          done
      - uses: actions/upload-artifact@v4
        with: { name: clips, path: out/ }
      - name: Save to clips-out
        run: |
          git config user.name clip-bot; git config user.email clip-bot@users.noreply.github.com
          mkdir -p /tmp/c && cp out/* /tmp/c/
          git fetch origin clips-out || true
          if git rev-parse --verify origin/clips-out >/dev/null 2>&1; then git checkout -B clips-out origin/clips-out; else git checkout --orphan clips-out && git rm -rf -q . && git clean -fdq; fi
          cp /tmp/c/* . && git add *.mp4 *.txt && git commit -m "clips: $(ls /tmp/c/*.mp4 | xargs -n1 basename | tr '\n' ' ')"
          for i in 1 2 3; do git push origin clips-out && break; git pull --rebase origin clips-out; done
