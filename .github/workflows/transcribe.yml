name: Transcribe reference audio

on:
  push:
    branches: [transcribe]

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper "av>=14"
      - name: Transcribe
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import pathlib
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for f in pathlib.Path("incoming_audio").glob("*.mp3"):
              segs, _ = m.transcribe(str(f), vad_filter=True)
              out = "\n".join(f"[{int(s.start//60)}:{s.start%60:04.1f}] {s.text.strip()}" for s in segs)
              f.with_suffix(".txt").write_text(out)
          PY
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add incoming_audio/*.txt && git commit -qm "transcripts" && git push origin HEAD:transcribe-out --force
