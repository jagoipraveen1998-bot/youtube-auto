name: Set a video's thumbnail
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true
      image:
        description: "Image path in this repo (e.g. data/thumbs/x.jpg)"
        required: true
  push:
    branches: [main]
    paths: [data/thumbs/pending.txt]
permissions:
  contents: read
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_HORROR_REFRESH_TOKEN: ${{ secrets.YT_HORROR_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ inputs.video_id }}" ]; then
            python scripts/set_thumbnail.py "${{ inputs.video_id }}" "${{ inputs.image }}"
          else
            read vid img < data/thumbs/pending.txt
            python scripts/set_thumbnail.py "$vid" "$img"
          fi
