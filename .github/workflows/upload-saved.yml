name: Upload saved videos (retries until YouTube allows it)

on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: upload-saved
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          n=$(python -c "import json,os;print(len(json.load(open('data/upload_queue.json'))) if os.path.exists('data/upload_queue.json') else 0)")
          echo "count=$n" >> "$GITHUB_OUTPUT"; echo "$n video(s) waiting"
      - if: steps.q.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.q.outputs.count != '0'
        run: pip install -q pyyaml google-api-python-client google-auth google-auth-oauthlib
      - if: steps.q.outputs.count != '0'
        name: Upload what YouTube allows
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_HORROR_REFRESH_TOKEN: ${{ secrets.YT_HORROR_REFRESH_TOKEN }}
        run: python upload_queue.py
      - if: steps.q.outputs.count != '0'
        name: Save the queue and history
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/upload_queue.json data/horror_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Upload queue: progress"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
