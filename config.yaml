# =============================================================
#  YouTube Auto - settings
#  Change these values, commit, and the next run uses them.
# =============================================================

channel:
  name: "How It Actually Works"       # shown on videos and thumbnails - change to your channel name
  topic: "how modern technology actually works, explained clearly"
  language: "en"

# ---------------- Funny baby rhymes (manual runs only now) ----------------
rhymes:
  per_compilation: 4                 # rhymes in the long video (~3 min); the 3 Shorts come from these
  music_volume: 0.30                 # background music loudness under the voice
  voices:                            # Kokoro (free, natural); Edge voices are the backup
    en:
      engine: "kokoro"               # kokoro | edge
      kokoro_lang: "a"               # a = American English, b = British
      kokoro_voice: "af_heart"       # the storyteller voice
      speed: 0.95
      semitones: 0.0
      name: "en-US-AnaNeural"        # backup voice if Kokoro cannot run
      rate: "-5%"
      pitch: "+0Hz"
      cast:                          # a different voice for every character
        narrator: { kokoro_voice: "af_heart",  speed: 0.95, semitones: 0.0 }
        milo:     { kokoro_voice: "am_puck",   speed: 1.00, semitones: 4.0 }
        pippa:    { kokoro_voice: "af_bella",  speed: 1.02, semitones: 2.0 }
        bramble:  { kokoro_voice: "am_michael", speed: 0.90, semitones: -2.0 }
        tilly:    { kokoro_voice: "bf_emma",    speed: 0.95, semitones: 1.0 }
        mum:      { kokoro_voice: "bf_isabella", speed: 0.95, semitones: 0.0 }
        friend:   { kokoro_voice: "af_nicole",  speed: 1.00, semitones: 2.0 }
    ta: { engine: "edge", name: "ta-IN-PallaviNeural", rate: "-8%", pitch: "+25Hz" }
  greeting:
    en:
      hello: "Hello friends! Let's sing some funny rhymes!"
      bye_title: "Bye bye!"
      bye: "Bye bye friends! See you tomorrow!"
      chapter_intro: "Hello friends!"
      chapters_label: "Rhymes in this video"
      footer: "New funny rhymes every day! Original songs written for little ones."
    ta:
      hello: "வணக்கம் குட்டீஸ்! வாங்க ஜாலியா பாடலாம்!"
      bye_title: "டாட்டா!"
      bye: "டாட்டா குட்டீஸ்! நாளைக்கு பார்க்கலாம்!"
      chapter_intro: "வணக்கம்!"
      chapters_label: "இந்த வீடியோவில் உள்ள பாடல்கள்"
      footer: "தினமும் புதிய வேடிக்கை பாடல்கள்! குழந்தைகளுக்காக எழுதப்பட்ட புதிய பாடல்கள்."
  extra_tags:
    en: ["nursery rhymes", "kids songs", "baby songs", "funny rhymes", "toddler songs", "rhymes for kids"]
    ta: ["tamil rhymes", "tamil kids songs", "kulanthai padalgal", "tamil nursery rhymes", "chutti padalgal"]
  hashtags:
    en: ["#nurseryrhymes", "#kidssongs", "#funnyrhymes"]
    ta: ["#tamilrhymes", "#tamilkidssongs", "#kulanthaipadalgal"]

# ---------------- Explainer videos (the main daily video now) ----------------
explainers:
  sections: 6                        # sections per video; each is about 20-30 seconds
  voice:                             # a clear adult narrator, not the children's voice
    engine: "kokoro"
    kokoro_lang: "b"                 # b = British English
    kokoro_voice: "bf_emma"
    speed: 1.0
    semitones: 0.0
    name: "en-GB-SoniaNeural"        # backup voice if Kokoro cannot run
    rate: "+0%"
    pitch: "+0Hz"

  threed:
    enabled: true
    engine: "WORKBENCH"
    width: 640
    height: 360
    fps: 12
    loop_seconds: 4
    samples: 1
    timeout: 900

# ---------------- Milo story episodes (paused) ----------------
episodes:
  scenes: 6                          # scenes per episode; more scenes = longer watch time
  shorts: 2                          # vertical Shorts cut from each episode (these bring subscribers)

# ---------------- 3D cartoon look (Blender, free) ----------------
threed:
  enabled: true                      # false = old 2D look
  engine: "CYCLES"                   # CYCLES (best look) | WORKBENCH (very fast) | EEVEE (too slow on GitHub)
  width: 640                         # render size (scaled up to 1080p for YouTube)
  height: 360
  fps: 12                            # animation frame rate (video is 30 fps)
  samples_cycles: 8
  samples_eevee: 4
  samples_workbench: 1
  exposure: 0.0                      # brightness boost for WORKBENCH
  studio_light: "Default"            # WORKBENCH light
  timeout: 1500                      # seconds per scene before falling back to 2D

ai:
  gemini_model: "auto"               # "auto" = newest Gemini Flash; or a name like "gemini-2.5-flash"

youtube:
  # "private" so nothing goes live until you have watched it and published it yourself.
  privacy: "private"
  category_id: "27"                  # 27 = Education
  made_for_kids: false               # the explainers are for adults
  contains_synthetic_media: false
  extra_tags: []

# ---------------- News videos (old mode, not scheduled any more) ----------------
voice:
  name: "en-IN-PrabhatNeural"
  rate: "+5%"
news:
  feeds:
    - "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en"
    - "https://www.thehindu.com/news/national/feeder/default.rss"
    - "https://timesofindia.indiatimes.com/rssfeedstopstories.cms"
    - "https://feeds.feedburner.com/ndtvnews-top-stories"
  max_age_hours: 30
  candidates: 30
video:
  stories: 7
  words_per_story: 160
  clips_per_story: 3
  background_music: "assets/music.mp3"
  music_volume: 0.08
