name: Daily explainer

on:
  schedule:
    - cron: "40 7 * * *"   # 07:40 UTC, before the UK and US morning
  workflow_dispatch:
    inputs:
      mode:
        description: "Render only by default, or upload privately"
        type: choice
        default: no-upload
        options:
          - no-upload
          - full

permissions:
  contents: write

concurrency:
  group: daily-episode-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  make-explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        id: apt
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          PKGS="ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji fonts-comic-neue espeak-ng"
          sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS || (sudo timeout 120 apt-get update -qq && sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS)
          ffmpeg -version | head -1

      - name: Install ffmpeg (backup download)
        if: steps.apt.outcome != 'success'
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5

      - name: Install Python packages
        timeout-minutes: 5
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Make today's explainer
        timeout-minutes: 45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "no-upload" ]; then
            python run_explainer.py --no-upload
          else
            python run_explainer.py
          fi

      - name: Save the test video so it can be watched (no-upload runs)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'no-upload'
        run: |
          mkdir -p previews
          cp output_explainer/explainer.mp4 previews/test_explainer.mp4
          cp output_explainer/thumbnail.jpg previews/test_explainer_thumb.jpg || true
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add previews/test_explainer*
          git commit -q -m "Test explainer (run ${GITHUB_RUN_NUMBER})"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && break
            sleep $((RANDOM % 10 + 3))
          done

      - name: Keep the video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-${{ github.run_number }}
          path: |
            output_explainer/explainer.mp4
            output_explainer/thumbnail.jpg
            output_explainer/description.txt
            output_explainer/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Save explainer history
        if: success()
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/explainer_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No history changes to save"
            exit 0
          fi
          git commit -m "Save explainer history for run ${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "Could not push explainer history after five retries" >&2
          exit 1
