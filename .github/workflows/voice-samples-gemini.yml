name: Voice samples (Gemini storytellers)

on:
  workflow_dispatch:
  push:
    branches: [voice-samples]

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -q requests
      - name: Make the samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/gemini_voice_samples.py
      - name: Save them on the voice-samples-out branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan voice-samples-out
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name voice_samples ! -name .git -exec rm -rf {} +
          git add voice_samples && git commit -qm "Gemini voice samples" && git push -f origin voice-samples-out
