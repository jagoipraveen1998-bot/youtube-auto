name: Inner Mechanics cleanup

on:
  push:
    branches: [inner-cleanup]
    paths: ["data/inner_cleanup.txt"]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth pyyaml
      - name: List (or delete) the channel's videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/inner/cleanup.py $(cat data/inner_cleanup.txt)
