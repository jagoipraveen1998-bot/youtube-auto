name: ytdlp-test
on:
  push:
    branches: [ig-backfill]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q -U yt-dlp
      - run: |
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" -o "v.%(ext)s" "https://www.youtube.com/shorts/QanbV5Eu3Lw" 2>&1 | tail -15
          ls -la
