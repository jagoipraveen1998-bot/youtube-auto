name: Weekly full-stories compilation (long video)

on:
  schedule:
    - cron: "37 10 * * 0"     # Sundays 10:37 UTC = 16:07 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Build only, or build and publish"
        type: choice
        default: no-upload
        options: [no-upload, full]

permissions:
  contents: write
  actions: read

concurrency:
  group: horror-compilation
  cancel-in-progress: false

jobs:
  compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core)
      - name: Install Python packages
        run: pip install -q pillow pyyaml google-api-python-client google-auth google-auth-oauthlib requests numpy
      - name: Build the compilation
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_HORROR_REFRESH_TOKEN: ${{ secrets.YT_HORROR_REFRESH_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "no-upload" ]; then python scripts/compilation.py --no-upload; else python scripts/compilation.py; fi
      - name: Keep the video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-${{ github.run_number }}
          path: |
            output_comp/video.mp4
            output_comp/cover.jpg
            output_comp/description.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Save compilation history
        if: success()
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/compilation_history.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Save compilation history for run ${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
          exit 1
