name: Football film narration (one-off)

on:
  push:
    branches: [football-film]
    paths: ["scripts/football/**", ".github/workflows/football-film.yml"]

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg || true
          pip install -q requests numpy soundfile pyyaml
      - name: Narrate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/football/voice.py
      - name: Save the narration to this branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f football_out/narration.wav football_out/scenes.json
          git commit -m "football film narration"
          git push
