name: Daily kids rhymes

on:
  schedule:
    - cron: "20 1 * * *"    # every day at 01:20 UTC = 6:50 AM India time
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: full
        options:
          - full          # make the videos and upload them
          - no-upload     # make the videos only (download them from the run page)
          - sample        # quick test with built-in sample rhymes (no AI, no upload)
      lang:
        description: "Language"
        type: choice
        default: en
        options: [en]

permissions:
  contents: write            # lets the run save the rhyme history

jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    strategy:
      fail-fast: false
      matrix:
        lang: [en]
    steps:
      - name: Skip languages not asked for
        id: want
        run: |
          WANT="${{ github.event_name == 'workflow_dispatch' && inputs.lang || 'both' }}"
          if [ "$WANT" = "both" ] || [ "$WANT" = "${{ matrix.lang }}" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.want.outputs.go == 'yes'

      - uses: actions/setup-python@v5
        if: steps.want.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts (fast path)
        id: apt
        if: steps.want.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          PKGS="ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji fonts-comic-neue"
          sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS \
            || (sudo timeout 120 apt-get update -qq && sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS)
          ffmpeg -version | head -1

      - name: Install ffmpeg (backup download)
        if: steps.want.outputs.go == 'yes' && steps.apt.outcome != 'success'
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5

      - name: Cache Blender
        if: steps.want.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3-linux-x64

      - name: Install Blender (free 3D; videos fall back to 2D if this fails)
        if: steps.want.outputs.go == 'yes'
        continue-on-error: true
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ ! -x "$HOME/blender/blender" ]; then
            mkdir -p "$HOME/blender"
            curl -fsSL --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
              | tar -xJ -C "$HOME/blender" --strip-components=1
          fi
          GL="xvfb libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libgl1-mesa-dri"
          sudo timeout 300 apt-get install -y -qq --no-install-recommends $GL > /dev/null \
            || (sudo timeout 120 apt-get update -qq && sudo timeout 300 apt-get install -y -qq --no-install-recommends $GL > /dev/null)
          "$HOME/blender/blender" --version | head -1
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Install Python packages
        if: steps.want.outputs.go == 'yes'
        timeout-minutes: 5
        run: pip install -q -r requirements.txt

      - name: Make (and upload) today's rhymes
        if: steps.want.outputs.go == 'yes'
        timeout-minutes: 170
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          case "$MODE" in
            sample)    python run_rhymes.py --lang ${{ matrix.lang }} --sample ;;
            no-upload) python run_rhymes.py --lang ${{ matrix.lang }} --no-upload ;;
            *)         python run_rhymes.py --lang ${{ matrix.lang }} ;;
          esac

      - name: Keep the videos for 3 days (download from this run's page)
        if: always() && steps.want.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: rhymes-${{ matrix.lang }}-${{ github.run_number }}
          path: |
            output_${{ matrix.lang }}/compilation.mp4
            output_${{ matrix.lang }}/short_*.mp4
            output_${{ matrix.lang }}/thumb_compilation.jpg
            output_${{ matrix.lang }}/description.txt
            output_${{ matrix.lang }}/rhymes.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Save test videos to the repo so they can be watched (sample mode only)
        if: success() && steps.want.outputs.go == 'yes' && github.event_name == 'workflow_dispatch' && inputs.mode == 'sample'
        run: |
          mkdir -p previews
          cp output_${{ matrix.lang }}/short_1.mp4 previews/test_short.mp4
          cp output_${{ matrix.lang }}/compilation.mp4 previews/test_compilation.mp4
          cp output_${{ matrix.lang }}/thumb_compilation.jpg previews/test_thumbnail.jpg
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add previews/test_short.mp4 previews/test_compilation.mp4 previews/test_thumbnail.jpg
          git commit -q -m "Test 3D videos (run ${GITHUB_RUN_NUMBER})"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && break
            sleep $((RANDOM % 10 + 3))
          done

      - name: Save history (so rhymes are never repeated)
        if: success() && steps.want.outputs.go == 'yes'
        run: |
          git config user.name "autotube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rhymes_history_${{ matrix.lang }}.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Rhymes history (${{ matrix.lang }}): $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase && git push -q && break
              sleep $((RANDOM % 10 + 3))
            done
          fi
