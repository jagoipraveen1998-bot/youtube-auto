name: Voice test (OmniVoice samples)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Install OmniVoice (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q omnivoice soundfile
      - name: Make the samples
        run: python tools/omnivoice_samples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnivoice-samples
          path: omnivoice_samples/
          retention-days: 7
