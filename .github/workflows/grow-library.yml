name: Grow the Creepyville library

on:
  schedule:
    - cron: "23 20 * * *"            # once a day, quiet hours
  workflow_dispatch:
  push:
    branches: [creepyville]
    paths: [horror/library/town.json, horror/library/props.json, scripts/library/build.py]

permissions:
  contents: write

concurrency:
  group: grow-library
  cancel-in-progress: false

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt "rembg[cpu]"
      - name: Paint new places
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/library/build.py 12 ${{ github.event_name == 'schedule' && '--grow' || '' }}
      - name: Keep them
        run: |
          git config user.name "autotube-bot"; git config user.email "actions@users.noreply.github.com"
          git add horror/plates horror/props horror/library
          git diff --cached --quiet && exit 0
          git commit -m "Creepyville library: new places"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
